<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Hidden practice pages: not linked from the portfolio and kept out of search results -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#17191c" />
    <title>Syllable chart · Korean · Kerstin Sun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="/korean/korean.css" />
    <!-- Same theme choice as the portfolio: saved choice, else the OS setting -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <a class="brand glass" href="/" aria-label="Kerstin Sun, portfolio home"><span class="brand-mark" aria-hidden="true">한</span>Kerstin Sun <small>Korean practice</small></a>
      <nav class="pill glass" aria-label="Korean practice">
        <a href="/korean/">Home</a>
        <a href="/korean/practice.html">Practice</a>
        <a href="/korean/grid.html" aria-current="page">Syllables</a>
      </nav>
      <div class="top-right"><button type="button" class="round glass" id="theme-toggle" aria-label="Switch theme"></button></div>
    </header>
    <main class="wrap" id="main">
      <div class="head">
        <h1>Syllable chart</h1>
        <p>Consonants across, vowels down. Tap a block to hear it and copy it.</p>
      </div>
      <div class="grid-tools">
        <span class="seg inline glass" role="group" aria-label="Range">
          <button type="button" id="r-basic" aria-pressed="true">Basic 14 × 10</button>
          <button type="button" id="r-all" aria-pressed="false">Full 19 × 21</button>
        </span>
        <span class="seg inline glass" role="group" aria-label="Romanization">
          <button type="button" id="p-show" aria-pressed="true">Show romanization</button>
          <button type="button" id="p-hide" aria-pressed="false">Hide to self-test</button>
        </span>
        <span class="legend">Green edge = vowels learned so far. ㅇ is silent at the start, so its column sounds like the vowel.</span>
      </div>
      <div class="card grid-card"><table id="grid"></table></div>
      <p class="note" id="voice-note"></p>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/korean/grid.js"></script>
  </body>
</html>
