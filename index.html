<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#17191c" />

    <title>Kerstin Sun — Software Engineer</title>
    <meta name="description" content="Kerstin Sun is a software engineer building AI systems and the data they run on: LLM agents at NVIDIA, data pipelines at Amazon, efficient inference research at Rice." />
    <link rel="canonical" href="https://kerstin-sun.com/" />

    <!-- Link previews (LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kerstin-sun.com/" />
    <meta property="og:title" content="Kerstin Sun — Software Engineer" />
    <meta property="og:description" content="Software engineer building AI systems and the data they run on." />
    <meta property="og:image" content="https://kerstin-sun.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Pick the theme before first paint: saved choice, else the OS setting -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>

</html>
